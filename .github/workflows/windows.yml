# Builds deadzone for Windows and, for a version tag, attaches the zip to
# that tag's GitHub release.
name: Windows

on:
  push:
    branches: [master, windows]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          arch: win64_msvc2022_64
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Fetch SDL 3 and ViGEmClient
        shell: bash
        run: bin/windows-deps

      - name: Build
        shell: cmd
        run: |
          mkdir build-win
          cd build-win
          qmake ..\deadzone.pro
          nmake /K

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path pkgbuild/PKGBUILD -Pattern '^pkgver=(.+)$').Matches[0].Groups[1].Value
          $name = "deadzone-$version-windows-x64"
          $out = "package/$name"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build-win/release/deadzone.exe $out
          Copy-Item windeps/SDL3/lib/x64/SDL3.dll $out
          Copy-Item dist/windows/README.txt $out
          Copy-Item LICENSE $out/LICENSE.txt
          windeployqt --release --qmldir src --no-translations --no-system-d3d-compiler --no-opengl-sw "$out/deadzone.exe"
          # The Visual C++ runtime, so nothing else needs installing.
          $crt = Get-ChildItem "$env:VCToolsRedistDir/x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          Copy-Item "$($crt.FullName)/*.dll" $out
          # Fails here if a DLL is missing.
          $check = Start-Process "$out/deadzone.exe" -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          if ($check.ExitCode -ne 0) { throw "deadzone.exe --version exited with $($check.ExitCode)" }
          Compress-Archive -Path $out -DestinationPath "package/$name.zip"
          "ZIP=package/$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.ZIP }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
