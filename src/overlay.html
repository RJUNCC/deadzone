<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>deadzone overlay</title>
<!--
  Served by deadzone on this computer for an OBS Browser Source.
  Options, added to the URL after "?":
    layout=full|compact   the whole controller, or just sticks and triggers
    raw=1                 also show the physical stick as a faint dot
    accent=ff3ea5         color for pressed buttons and the stick dots
    buttons=ps|xbox       face button labels
    profile=1             show the profile name underneath
    scale=1.5             size
    trail=1               a fading trail behind each stick
    history=1             a strip of the last three seconds of button presses underneath
    demo=1                move on its own, for placing it in OBS without a controller
    replay=inputs-….json  play back a saved input recording instead of the live controller
    controls=0            hide the replay controls (for OBS); loop=1 plays it on repeat
-->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: system-ui, sans-serif; }
  #stage { position: relative; transform-origin: top left; }
  svg { display: block; }
  #trail { position: absolute; left: 0; top: 0; pointer-events: none; }
  #history { display: block; }
  .body { fill: rgba(18, 18, 22, 0.78); stroke: rgba(255, 255, 255, 0.16); stroke-width: 2; }
  .idle { fill: rgba(255, 255, 255, 0.10); stroke: rgba(255, 255, 255, 0.28); stroke-width: 1.5; }
  .well { fill: rgba(0, 0, 0, 0.35); stroke: rgba(255, 255, 255, 0.22); stroke-width: 1.5; }
  .glyph { fill: none; stroke: rgba(255, 255, 255, 0.75); stroke-width: 2.2; }
  .label { fill: rgba(255, 255, 255, 0.8); font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  .on { fill: var(--accent); stroke: var(--accent); }
  .on + .glyph, .on + .label { stroke: #111; fill: #111; }
  .well.pressed { stroke: var(--accent); stroke-width: 5; }
  .trackbg { fill: rgba(255, 255, 255, 0.10); stroke: rgba(255, 255, 255, 0.25); stroke-width: 1.5; }
  .fill { fill: var(--accent); }
  .raw { fill: rgba(255, 255, 255, 0.35); }
  .dot { fill: var(--accent); stroke: rgba(0, 0, 0, 0.6); stroke-width: 2; }
  .profile { fill: rgba(255, 255, 255, 0.85); font-size: 18px; font-weight: 600; text-anchor: middle; }
  .compact .full-only { display: none; }
  .waiting { opacity: 0.35; }
  #controls { display: none; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 10px;
              background: rgba(18, 18, 22, 0.92); border-radius: 10px; color: #e4e4e7; font-size: 13px; width: 580px; box-sizing: border-box; }
  #controls button { background: #26262c; color: #e4e4e7; border: 0; border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; }
  #controls button.on { background: var(--accent); color: #111; }
  #controls input[type=range] { flex: 1; accent-color: var(--accent); }
  #time { font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
</style>
</head>
<body>
<div id="stage">
<svg id="pad" width="600" height="390" viewBox="0 0 600 390">
  <g class="full-only">
    <path class="body" d="M150 70 H450 C520 70 560 110 575 180 L595 300 C602 345 570 372 540 362 C510 352 490 312 460 292 H140 C110 312 90 352 60 362 C30 372 -2 345 5 300 L25 180 C40 110 80 70 150 70 Z"/>
    <rect class="idle" x="235" y="86" width="130" height="62" rx="10"/>
    <rect id="b6" class="idle" x="205" y="98" width="16" height="30" rx="7"/>
    <rect id="b7" class="idle" x="379" y="98" width="16" height="30" rx="7"/>
    <circle id="b8" class="idle" cx="300" cy="250" r="13"/>
    <!-- D-pad -->
    <rect id="b11" class="idle" x="108" y="114" width="24" height="28" rx="4"/>
    <rect id="b12" class="idle" x="108" y="158" width="24" height="28" rx="4"/>
    <rect id="b13" class="idle" x="80" y="138" width="28" height="24" rx="4"/>
    <rect id="b14" class="idle" x="132" y="138" width="28" height="24" rx="4"/>
    <!-- Face buttons; their labels are filled in for PlayStation or Xbox. -->
    <g id="faces"></g>
    <!-- Bumpers -->
    <rect id="b4" class="idle" x="95" y="46" width="120" height="16" rx="8"/>
    <rect id="b5" class="idle" x="385" y="46" width="120" height="16" rx="8"/>
  </g>
  <!-- Triggers -->
  <rect class="trackbg" x="95" y="12" width="120" height="22" rx="6"/>
  <rect id="l2" class="fill" x="95" y="12" width="0" height="22" rx="6"/>
  <rect class="trackbg" x="385" y="12" width="120" height="22" rx="6"/>
  <rect id="r2" class="fill" x="385" y="12" width="0" height="22" rx="6"/>
  <!-- Sticks -->
  <circle id="l3" class="well" cx="200" cy="215" r="44"/>
  <circle id="lraw" class="raw" cx="200" cy="215" r="8" visibility="hidden"/>
  <circle id="ldot" class="dot" cx="200" cy="215" r="15"/>
  <circle id="r3" class="well" cx="400" cy="215" r="44"/>
  <circle id="rraw" class="raw" cx="400" cy="215" r="8" visibility="hidden"/>
  <circle id="rdot" class="dot" cx="400" cy="215" r="15"/>
  <text id="profile" class="profile" x="300" y="384" visibility="hidden"></text>
</svg>
<canvas id="trail"></canvas>
<canvas id="history"></canvas>
<div id="controls">
  <button id="play" title="Space">Pause</button>
  <button id="back" title="Left arrow: one frame back">‹</button>
  <button id="fwd" title="Right arrow: one frame forward">›</button>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <span id="time">0:00.0</span>
  <button class="speed" data-speed="0.25">¼×</button>
  <button class="speed" data-speed="0.5">½×</button>
  <button class="speed on" data-speed="1">1×</button>
</div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const accent = "#" + (params.get("accent") || "ffd60a").replace(/[^0-9a-fA-F]/g, "").slice(0, 6);
  const scale = Math.min(6, Math.max(0.2, parseFloat(params.get("scale") || "1")));
  const compact = params.get("layout") === "compact";
  const showRaw = params.get("raw") === "1";
  const showProfile = params.get("profile") === "1";
  const xbox = params.get("buttons") === "xbox";
  const svg = document.getElementById("pad");
  document.documentElement.style.setProperty("--accent", accent);
  if (compact) {
    svg.classList.add("compact");
    svg.setAttribute("viewBox", "80 0 440 270");
    svg.setAttribute("width", 440);
    svg.setAttribute("height", 270);
  }
  const showTrail = params.get("trail") === "1";
  const showHistory = params.get("history") === "1";
  const stage = document.getElementById("stage");
  stage.style.transform = `scale(${scale})`;
  const originX = compact ? 80 : 0;
  const pageWidth = compact ? 440 : 600, padHeight = compact ? 270 : 390;
  const trailCanvas = document.getElementById("trail");
  const historyCanvas = document.getElementById("history");
  const ratio = Math.max(1, window.devicePixelRatio * scale);
  function sizeCanvas(c, w, h) {
    c.width = w * ratio; c.height = h * ratio;
    c.style.width = w + "px"; c.style.height = h + "px";
    c.getContext("2d").setTransform(ratio, 0, 0, ratio, 0, 0);
  }
  sizeCanvas(trailCanvas, pageWidth, padHeight);
  sizeCanvas(historyCanvas, pageWidth, showHistory ? 100 : 0);
  historyCanvas.style.display = showHistory ? "block" : "none";
  for (const id of ["lraw", "rraw"]) document.getElementById(id).setAttribute("visibility", showRaw ? "visible" : "hidden");
  document.getElementById("profile").setAttribute("visibility", showProfile ? "visible" : "hidden");

  // Bits 0-3: bottom, right, left, top face buttons.
  const faces = [[480, 182, 0], [512, 150, 1], [448, 150, 2], [480, 118, 3]];
  const ns = "http://www.w3.org/2000/svg";
  const facesGroup = document.getElementById("faces");
  for (const [x, y, bit] of faces) {
    const circle = document.createElementNS(ns, "circle");
    Object.entries({ id: "b" + bit, class: "idle", cx: x, cy: y, r: 15 }).forEach(([k, v]) => circle.setAttribute(k, v));
    facesGroup.appendChild(circle);
    if (xbox) {
      const text = document.createElementNS(ns, "text");
      Object.entries({ class: "label", x, y }).forEach(([k, v]) => text.setAttribute(k, v));
      text.textContent = ["A", "B", "X", "Y"][bit];
      facesGroup.appendChild(text);
    } else {
      // Cross, circle, square, and triangle drawn as plain shapes.
      const shape = document.createElementNS(ns, bit === 1 ? "circle" : bit === 2 ? "rect" : "path");
      const attrs = bit === 0 ? { d: `M${x - 6} ${y - 6} L${x + 6} ${y + 6} M${x + 6} ${y - 6} L${x - 6} ${y + 6}` }
                  : bit === 1 ? { cx: x, cy: y, r: 7 }
                  : bit === 2 ? { x: x - 6, y: y - 6, width: 12, height: 12 }
                  : { d: `M${x} ${y - 8} L${x + 7.5} ${y + 5} L${x - 7.5} ${y + 5} Z` };
      Object.entries({ class: "glyph", ...attrs }).forEach(([k, v]) => shape.setAttribute(k, v));
      facesGroup.appendChild(shape);
    }
  }

  const el = id => document.getElementById(id);
  const travel = 30;
  function place(dot, cx, cy, x, y) {
    dot.setAttribute("cx", cx + x * travel);
    dot.setAttribute("cy", cy + y * travel);
  }
  let latest = null;
  // The last three seconds, sampled every frame, for the trail and history.
  const samples = [];
  // Long enough to show a flick, short enough not to clutter.
  const trailMs = 500;
  function drawTrail(now) {
    const ctx = trailCanvas.getContext("2d");
    ctx.clearRect(0, 0, pageWidth, padHeight);
    if (!showTrail) return;
    for (const [cx, kx, ky] of [[200, "lx", "ly"], [400, "rx", "ry"]]) {
      const recent = samples.filter(p => now - p.t < trailMs);
      for (let i = 1; i < recent.length; ++i) {
        const a = recent[i - 1], b = recent[i];
        ctx.strokeStyle = accent;
        ctx.globalAlpha = 0.85 * (1 - (now - b.t) / trailMs);
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(cx - originX + a.s[kx] * travel, 215 + a.s[ky] * travel);
        ctx.lineTo(cx - originX + b.s[kx] * travel, 215 + b.s[ky] * travel);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }
  // Lanes for the buttons that matter in Rocket League, newest on the right.
  const lanes = xbox ? [["A", 0], ["B", 1], ["X", 2], ["Y", 3], ["LB", 4], ["RB", 5], ["LT", -1], ["RT", -2]]
                     : [["✕", 0], ["○", 1], ["□", 2], ["△", 3], ["L1", 4], ["R1", 5], ["L2", -1], ["R2", -2]];
  const pressed = (s, bit) => bit === -1 ? s.l2 > 0.5 : bit === -2 ? s.r2 > 0.5 : (s.b >> bit & 1) === 1;
  function drawHistory(now) {
    if (!showHistory) return;
    const ctx = historyCanvas.getContext("2d");
    const w = pageWidth, h = 100, left = 34, span = 3000;
    const laneH = (h - 8) / lanes.length;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "rgba(18, 18, 22, 0.78)";
    ctx.beginPath(); ctx.roundRect(0, 0, w, h, 10); ctx.fill();
    ctx.font = "bold 10px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    lanes.forEach(([label, bit], lane) => {
      const y = 4 + lane * laneH;
      ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
      ctx.fillText(label, left / 2, y + laneH / 2);
      ctx.fillStyle = accent;
      let start = null;
      for (let i = 0; i <= samples.length; ++i) {
        const p = samples[i];
        const on = p && pressed(p.s, bit);
        if (on && start === null) start = p.t;
        if (!on && start !== null) {
          const end = p ? p.t : now;
          const x0 = left + (1 - (now - start) / span) * (w - left - 6);
          const x1 = left + (1 - (now - end) / span) * (w - left - 6);
          ctx.fillRect(Math.max(left, x0), y + 2, Math.max(2, x1 - Math.max(left, x0)), laneH - 4);
          start = null;
        }
      }
    });
  }
  let current = null;
  function draw() {
    requestAnimationFrame(draw);
    const now = performance.now();
    if (latest) { current = latest; latest = null; }
    if (current) samples.push({ t: now, s: current });
    while (samples.length && now - samples[0].t > 3000) samples.shift();
    drawTrail(now);
    drawHistory(now);
    if (!current) return;
    const s = current;
    place(el("ldot"), 200, 215, s.lx, s.ly);
    place(el("rdot"), 400, 215, s.rx, s.ry);
    place(el("lraw"), 200, 215, s.lrx, s.lry);
    place(el("rraw"), 400, 215, s.rrx, s.rry);
    el("l2").setAttribute("width", 120 * s.l2);
    el("r2").setAttribute("width", 120 * s.r2);
    for (let bit = 0; bit <= 14; ++bit) {
      const node = document.getElementById("b" + bit);
      if (node) node.classList.toggle("on", (s.b >> bit & 1) === 1);
    }
    // A clicked stick rings in the accent rather than filling, so the dot stays visible.
    el("l3").classList.toggle("pressed", (s.b >> 9 & 1) === 1);
    el("r3").classList.toggle("pressed", (s.b >> 10 & 1) === 1);
    el("profile").textContent = s.p || "";
    svg.classList.toggle("waiting", !s.c);
  }
  requestAnimationFrame(draw);

  const replay = params.get("replay");
  if (replay) {
    // Playback of a saved recording: rows of
    // [ms, lx, ly, rx, ry, lrx, lry, rrx, rry, l2, r2, buttons].
    const controls = document.getElementById("controls");
    if (params.get("controls") !== "0") controls.style.display = "flex";
    const loop = params.get("loop") === "1";
    let rows = [], length = 1, position = 0, speed = 1, playing = true, last = performance.now();
    const fmt = ms => `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, "0")}.${Math.floor(ms / 100) % 10}`;
    const stateAt = row => ({ lx: row[1], ly: row[2], rx: row[3], ry: row[4], lrx: row[5], lry: row[6], rrx: row[7], rry: row[8],
                              l2: row[9], r2: row[10], b: row[11], p: "", c: true });
    function indexAt(ms) {
      let lo = 0, hi = rows.length - 1;
      while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (rows[mid][0] <= ms) lo = mid; else hi = mid - 1; }
      return lo;
    }
    function tick() {
      requestAnimationFrame(tick);
      if (!rows.length) return;
      const now = performance.now();
      if (playing) position += (now - last) * speed;
      last = now;
      if (position >= length) { position = loop ? 0 : length; if (!loop) setPlaying(false); }
      const i = indexAt(position);
      latest = stateAt(rows[i]);
      // The trail and history are rebuilt from the recording itself, so
      // seeking and slow motion show them correctly.
      samples.length = 0;
      for (let j = indexAt(Math.max(0, position - 3000)); j <= i; ++j)
        samples.push({ t: now - (position - rows[j][0]), s: stateAt(rows[j]) });
      el("seek").value = Math.round(position / length * 1000);
      el("time").textContent = fmt(position) + " / " + fmt(length);
    }
    function setPlaying(on) { playing = on; el("play").textContent = on ? "Pause" : "Play"; }
    function step(frames) { setPlaying(false); position = Math.min(length, Math.max(0, position + frames * 1000 / 60)); }
    el("play").onclick = () => { if (position >= length) position = 0; setPlaying(!playing); };
    el("back").onclick = () => step(-1);
    el("fwd").onclick = () => step(1);
    el("seek").oninput = e => { position = e.target.value / 1000 * length; };
    for (const b of document.querySelectorAll(".speed"))
      b.onclick = () => { speed = parseFloat(b.dataset.speed); document.querySelectorAll(".speed").forEach(x => x.classList.toggle("on", x === b)); };
    document.addEventListener("keydown", e => {
      if (e.key === " ") { e.preventDefault(); el("play").click(); }
      if (e.key === "ArrowLeft") step(-1);
      if (e.key === "ArrowRight") step(1);
    });
    fetch("/recording?name=" + encodeURIComponent(replay)).then(r => r.json()).then(file => {
      rows = file.samples || [];
      length = rows.length ? Math.max(1, rows[rows.length - 1][0]) : 1;
      last = performance.now();
      requestAnimationFrame(tick);
    }).catch(() => svg.classList.add("waiting"));
  } else if (params.get("demo") === "1") {
    // Sticks circling, triggers breathing, and buttons taking turns.
    const demo = t => ({ lx: Math.cos(t * 1.7), ly: Math.sin(t * 1.7), rx: 0.6 * Math.sin(t), ry: 0.6 * Math.cos(t * 1.3),
                         lrx: 0.9 * Math.cos(t * 1.7), lry: 0.9 * Math.sin(t * 1.7), rrx: 0.55 * Math.sin(t), rry: 0.55 * Math.cos(t * 1.3),
                         l2: (Math.sin(t * 2) + 1) / 2, r2: (Math.cos(t * 1.5) + 1) / 2,
                         b: 1 << (Math.floor(t * 2) % 15), p: "Demo", c: true });
    // The last three seconds are filled in at once, so the trail and the
    // history look complete as soon as the preview opens.
    const start = performance.now();
    for (let ago = 3000; ago > 0; ago -= 16)
      samples.push({ t: start - ago, s: demo((Date.now() - ago) / 1000) });
    setInterval(() => { latest = demo(Date.now() / 1000); }, 16);
  } else {
    // EventSource reconnects on its own if deadzone restarts.
    const events = new EventSource("/events");
    events.onmessage = e => { latest = JSON.parse(e.data); };
    events.onerror = () => svg.classList.add("waiting");
  }
</script>
</body>
</html>
